name: Scan Lantier Emails

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  scan-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar scanner de emails
        run: |
          curl --fail \
            --max-time 310 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://latier-inteligencia-email.vercel.app/api/scan-emails"